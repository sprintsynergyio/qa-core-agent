name: QA-Core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_eval:
        description: 'Also run the eval harness'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, build, smoke (Node ${{ matrix.node }})
    # Pinned on purpose: ubuntu-latest is Ubuntu 26.04, where Playwright 1.60
    # cannot install Chromium (PR #61). Move back to ubuntu-latest together
    # with a Playwright upgrade, and raise the emitted framework's pin then.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install dashboard dependencies
        run: npm --prefix dashboard ci

      - name: Build the dashboard
        run: npm run dashboard:build

      # No zip or unzip package is installed: the agent builds framework zips in
      # process and the smokes read them back the same way (adm-zip).

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No ANTHROPIC_API_KEY here and no QA_CORE_LIVE_SMOKES: the live smokes
      # (a paid model call or a public website) are skipped, never counted as
      # passed. Every other smoke runs against local fixtures.
      - name: Smoke suite
        run: npm run smoke

  eval:
    name: Eval harness (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_eval == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run eval
        run: npm run eval
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          retention-days: 30
